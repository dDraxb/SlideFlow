<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 928 336" role="img" aria-labelledby="sf-flow-title sf-flow-desc" font-family="'Helvetica Neue', Arial, sans-serif">
  <title id="sf-flow-title">From zero to on stage</title>
  <desc id="sf-flow-desc">Three-stage flow: scaffold a deck app with pnpm create slideflow, author slides in deck.tsx with stage components, then present with reveals, the explain drawer, and deep links; a dashed return arrow shows iterating between presenting and authoring.</desc>
  <defs>
    <marker id="sff-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="sff-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#059669"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f6f7f8"/>

  <!-- arrows (drawn before nodes) -->
  <path d="M 288,152 H 342" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sff-arrow)"/>
  <rect x="291" y="132" width="48" height="12" rx="2" fill="#f6f7f8"/>
  <text x="315" y="141" fill="#7a8399" font-size="8" font-family="Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">DECK APP</text>

  <path d="M 584,152 H 638" fill="none" stroke="#059669" stroke-width="1.2" marker-end="url(#sff-arrow-accent)"/>
  <rect x="587" y="132" width="48" height="12" rx="2" fill="#f6f7f8"/>
  <text x="611" y="141" fill="#059669" font-size="8" font-family="Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">PNPM DEV</text>

  <!-- iterate loop (dashed return) -->
  <path d="M 760,208 V 256 Q 760,264 752,264 H 472 Q 464,264 464,256 V 211" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#sff-arrow)"/>
  <rect x="590" y="246" width="44" height="12" rx="2" fill="#f6f7f8"/>
  <text x="612" y="255" fill="#7a8399" font-size="8" font-family="Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">ITERATE</text>

  <!-- 01 scaffold -->
  <rect x="48" y="96" width="240" height="112" rx="6" fill="#f6f7f8"/>
  <rect x="48" y="96" width="240" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="56" y="102" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="66" y="111" fill="rgba(45,49,66,0.8)" font-size="7" font-family="Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">01</text>
  <text x="168" y="144" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Scaffold</text>
  <text x="168" y="164" fill="#4f5d75" font-size="9" font-family="Menlo, Consolas, monospace" text-anchor="middle">pnpm create slideflow</text>
  <text x="168" y="180" fill="#4f5d75" font-size="9" font-family="Menlo, Consolas, monospace" text-anchor="middle">template + authoring docs + lint</text>

  <!-- 02 author -->
  <rect x="344" y="96" width="240" height="112" rx="6" fill="#f6f7f8"/>
  <rect x="344" y="96" width="240" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="352" y="102" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="362" y="111" fill="rgba(45,49,66,0.8)" font-size="7" font-family="Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">02</text>
  <text x="464" y="144" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Author</text>
  <text x="464" y="164" fill="#4f5d75" font-size="9" font-family="Menlo, Consolas, monospace" text-anchor="middle">deck.tsx · stages/*.tsx</text>
  <text x="464" y="180" fill="#4f5d75" font-size="9" font-family="Menlo, Consolas, monospace" text-anchor="middle">reveals · narration · lint:text</text>

  <!-- 03 present (focal) -->
  <rect x="640" y="96" width="240" height="112" rx="6" fill="#f6f7f8"/>
  <rect x="640" y="96" width="240" height="112" rx="6" fill="rgba(5,150,105,0.05)" stroke="#059669" stroke-width="1"/>
  <rect x="648" y="102" width="20" height="12" rx="2" fill="transparent" stroke="rgba(5,150,105,0.40)" stroke-width="0.8"/>
  <text x="658" y="111" fill="rgba(5,150,105,0.85)" font-size="7" font-family="Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">03</text>
  <text x="760" y="144" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Present</text>
  <text x="760" y="164" fill="#4f5d75" font-size="9" font-family="Menlo, Consolas, monospace" text-anchor="middle">keyboard · drawer · learn mode</text>
  <text x="760" y="180" fill="#4f5d75" font-size="9" font-family="Menlo, Consolas, monospace" text-anchor="middle">deep links · #/3/2</text>

  <!-- legend -->
  <line x1="48" y1="300" x2="880" y2="300" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="48" y="320" fill="#4f5d75" font-size="8" font-family="Menlo, Consolas, monospace" letter-spacing="0.14em">LEGEND</text>
  <rect x="120" y="310" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="140" y="320" fill="#4f5d75" font-size="8" font-family="Menlo, Consolas, monospace">STAGE</text>
  <rect x="208" y="310" width="12" height="12" rx="2" fill="rgba(5,150,105,0.05)" stroke="#059669" stroke-width="1"/>
  <text x="228" y="320" fill="#4f5d75" font-size="8" font-family="Menlo, Consolas, monospace">THE PAYOFF</text>
  <line x1="332" y1="316" x2="360" y2="316" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="368" y="320" fill="#4f5d75" font-size="8" font-family="Menlo, Consolas, monospace">REHEARSE AND REFINE</text>
</svg>
